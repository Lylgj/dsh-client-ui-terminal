# 示例：把本插件注册进 DSH 的 web profile
#
# 文件位置：<profile 目录>/cordis.patch.yml（默认 ~/.dsh/profiles/web/cordis.patch.yml）
# 该文件是「用户 patch 层」，在 profile 的所有 bundle 层之后应用；
# 顶层是一个 YAML 数组，数组项是 loader 的 patch 条目。
#
# 复制下面这段（连同注释）到你自己的 cordis.patch.yml 即可。

# DSH Web 右侧常驻终端面板（宿主半边）。
# 本包是双面包：宿主半边把 xterm 静态资源与 PTY 的 WebSocket 挂到同源 webServer
# 上，浏览器半边由 package.json 的 dsh.client 声明自动发现并投递到页面。
#
# 这里用「相对路径 + ?rev=N」而不是裸包名，原因是 cordis loader 的模块导入以
# 解析后的 URL 为缓存键：裸包名永远解析到同一个 URL，改了代码也不会重新导入
# （配置 diff 在 name 不变时直接复用旧 callback）。带上 rev 查询串即可得到新的
# URL，从而在**不重启 dsh web** 的前提下热加载宿主半边的新代码。改完代码把 rev
# 加一保存，本文件受 Cordis HMR 监视，会立即生效。
- insert:
    - id: ui-terminal
      name: './node_modules/@deepseek-ai/dsh-client-ui-terminal/lib/index.js?rev=1'
