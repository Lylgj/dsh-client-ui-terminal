# 示例：手工安装时把本插件注册进 DSH profile
#
# 注意：按 README「方式一」用 `dsh plugin add file:<本仓库>` 安装时，
# 本包自带的 cordis.patch.yml 会自动插入同样的行，不需要再手改这个文件。
#
# 文件位置：<profile 目录>/cordis.patch.yml（默认 ~/.dsh/profiles/web/cordis.patch.yml）
# 该文件是「用户 patch 层」，在 profile 的所有 bundle 层之后应用；
# 顶层是一个 YAML 数组，数组项是 loader 的 patch 条目。
#
# 复制下面这段（连同注释）到你自己的 cordis.patch.yml 即可。

# DSH Web 右侧常驻终端面板（宿主半边）。
# 本包是双面包：宿主半边把 xterm 静态资源与 PTY 的 WebSocket 挂到同源 webServer
# 上，浏览器半边由 package.json 的 dsh.client 声明自动发现并投递到页面。
#
# 这里用相对路径而不是裸包名：相对路径在 profile 作用域内解析到插件入口。
# 注意 path 里不要带查询串：DSH 0.2.2 的 loader 会把 ?rev=N 当成文件名的一部分，
# 报 ERR_MODULE_NOT_FOUND（旧版 loader 曾用 ?rev=N 制造新 URL 来热加载宿主半边，
# 0.2.2 不再适用——宿主半边的代码改动需要重启 DSH 才生效）。
- insert:
    - id: ui-terminal
      name: './node_modules/dsh-terminal/lib/index.js'
